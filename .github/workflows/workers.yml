name: Worker CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION_FILE: .nvmrc

jobs:
  validate:
    name: validate
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      build_identity: ${{ steps.identity.outputs.build_identity }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Determine build identity
        id: identity
        shell: bash
        run: |
          git fetch --tags --force
          release_tag=""

          if [[ "$GITHUB_REF" == "refs/heads/main" && ("$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch") ]]; then
            existing_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v*.*.*' --sort=version:refname | tail -n 1)"
            if [[ -n "$existing_tag" ]]; then
              release_tag="$existing_tag"
            else
              latest_tag="$(git tag --list 'v*.*.*' --sort=-version:refname | head -n 1)"
              if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                major="${BASH_REMATCH[1]}"
                minor="${BASH_REMATCH[2]}"
                patch="${BASH_REMATCH[3]}"
              else
                major=0
                minor=0
                patch=0
              fi
              release_tag="v${major}.${minor}.$((patch + 1))"
            fi
            build_identity="$release_tag"
          else
            build_identity="preview-${GITHUB_SHA:0:7}"
          fi

          echo "build_identity=$build_identity" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Build identity: $build_identity"

      - name: Run tests
        run: npm test

      - name: Build validated assets
        env:
          VITE_RELEASE_VERSION: ${{ steps.identity.outputs.build_identity }}
        run: npm run build

      - name: Upload build artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy-preview:
    name: deploy-preview
    if: >-
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      !startsWith(github.ref, 'refs/heads/dependabot/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview-${{ github.ref_name }}
      url: ${{ steps.preview.outputs.preview_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deployment tooling
        run: npm ci --ignore-scripts

      - name: Download validated build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Upload Worker preview version
        id: preview
        shell: bash
        run: |
          preview_alias="$(printf '%s' "$GITHUB_REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-48)"
          if [[ -z "$preview_alias" ]]; then
            preview_alias="preview"
          fi

          echo "Preview alias: $preview_alias"
          ./node_modules/.bin/wrangler versions upload --preview-alias "$preview_alias" 2>&1 | tee /tmp/wrangler-preview.log

          preview_url="https://${preview_alias}-nurmi-dev.nurmi-vp.workers.dev/"
          preview_code=""
          for attempt in {1..10}; do
            preview_code="$(curl -sS -o /tmp/nurmi-preview.html -w '%{http_code}' "$preview_url" || true)"
            if [[ "$preview_code" == 2* ]]; then
              break
            fi
            sleep 3
          done
          if [[ "$preview_code" != 2* ]]; then
            echo "Preview URL did not return a successful response: $preview_url (HTTP $preview_code)"
            exit 1
          fi
          echo "Preview URL: $preview_url (HTTP $preview_code)"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

          {
            echo "### Cloudflare Worker preview"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Alias: $preview_alias"
            echo "- URL: $preview_url"
            echo "- HTTP status: $preview_code"
            echo "- Commit: $GITHUB_SHA"
            echo
            echo '```text'
            cat /tmp/wrangler-preview.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-preview:
    name: cleanup-preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      pull-requests: read
    steps:
      - name: Remove closed pull request preview deployments
        uses: actions/github-script@v9
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const headOwner = context.payload.pull_request.head.repo?.owner.login;
            const environment = `preview-${branch}`;

            if (!headOwner) {
              core.info(`No head repository owner found for ${branch}; nothing to clean.`);
              return;
            }

            const openPullRequests = await github.paginate(
              github.rest.pulls.list,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                head: `${headOwner}:${branch}`,
                per_page: 100,
              },
            );
            if (openPullRequests.length > 0) {
              core.info(`Keeping ${environment}; another open PR still uses ${branch}.`);
              return;
            }

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment,
                ref: branch,
                per_page: 100,
              },
            );

            for (const deployment of deployments) {
              if (deployment.active) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: "inactive",
                  environment,
                  description: "Preview removed after pull request closure.",
                });
              }
              await github.rest.repos.deleteDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
              });
            }
            core.info(`Removed ${deployments.length} deployment(s) for ${environment}.`);

  deploy-production:
    name: deploy-production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nurmi.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deployment tooling
        run: npm ci --ignore-scripts

      - name: Download validated build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Deploy Worker production version
        run: ./node_modules/.bin/wrangler deploy 2>&1 | tee /tmp/wrangler-production.log

      - name: Publish deployment summary
        run: |
          {
            echo "### Cloudflare Worker production"
            echo "- Worker: nurmi-dev"
            echo "- Commit: $GITHUB_SHA"
            echo
            echo '```text'
            cat /tmp/wrangler-production.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release-production:
    name: tag and release production
    if: needs.deploy-production.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [validate, deploy-production]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Allocate stable tag and create release idempotently
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          release_tag="$RELEASE_TAG"

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release tag: $release_tag"
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "$release_tag" 2>/dev/null || true)"
          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $release_tag already points to $tag_commit, not $GITHUB_SHA"
            exit 1
          fi
          if [[ -z "$tag_commit" ]]; then
            git tag "$release_tag" "$GITHUB_SHA"
            git push origin "refs/tags/$release_tag"
          else
            echo "Tag $release_tag already points to this deployed commit"
          fi

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "GitHub Release $release_tag already exists"
          else
            gh release create "$release_tag" --verify-tag --generate-notes --title "$release_tag"
          fi
