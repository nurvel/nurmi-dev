name: Worker CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION_FILE: .nvmrc

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy-preview:
    name: deploy-preview
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deployment tooling
        run: npm ci

      - name: Download validated build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Upload Worker preview version
        shell: bash
        run: |
          preview_alias="$(printf '%s' "$GITHUB_REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-48)"
          if [[ -z "$preview_alias" ]]; then
            preview_alias="preview"
          fi

          echo "Preview alias: $preview_alias"
          npm exec wrangler -- versions upload --preview-alias "$preview_alias" 2>&1 | tee /tmp/wrangler-preview.log

          preview_url="https://${preview_alias}-nurmi-dev.nurmi-vp.workers.dev/"
          preview_code=""
          for attempt in {1..10}; do
            preview_code="$(curl -sS -o /tmp/nurmi-preview.html -w '%{http_code}' "$preview_url" || true)"
            if [[ "$preview_code" == 2* ]]; then
              break
            fi
            sleep 3
          done
          if [[ "$preview_code" != 2* ]]; then
            echo "Preview URL did not return a successful response: $preview_url (HTTP $preview_code)"
            exit 1
          fi
          echo "Preview URL: $preview_url (HTTP $preview_code)"

          {
            echo "### Cloudflare Worker preview"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Alias: $preview_alias"
            echo "- URL: $preview_url"
            echo "- HTTP status: $preview_code"
            echo "- Commit: $GITHUB_SHA"
            echo
            echo '```text'
            cat /tmp/wrangler-preview.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deployment tooling
        run: npm ci

      - name: Download validated build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Deploy Worker production version
        run: npm exec wrangler -- deploy 2>&1 | tee /tmp/wrangler-production.log

      - name: Publish deployment summary
        run: |
          {
            echo "### Cloudflare Worker production"
            echo "- Worker: nurmi-dev"
            echo "- Commit: $GITHUB_SHA"
            echo
            echo '```text'
            cat /tmp/wrangler-production.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
